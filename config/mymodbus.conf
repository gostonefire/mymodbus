# mymodbus.conf
web_server.bind_address=<bind IP address>
web_server.bind_port=8080
modbus.serial_port=/dev/ttyACM0
modbus.mock=false
cache.in_memory_hours=48
cache.persistence_path=/home/petste/MyModbus/cache
cache.persistence_days=7
cache.persistence_rotate_samples=1440
general.log_path=/home/petste/MyModbus/logs/app.log
general.log_level=Warn
general.log_to_stdout=false
